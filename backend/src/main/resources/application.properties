server.port=8081
spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/red_tourism?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${MYSQL_USER:red_tourism}
spring.datasource.password=${BISHE_MYSQL_PASSWORD:}
spring.sql.init.mode=always
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=250ms
spring.data.redis.timeout=300ms
app.cache.enabled=${REDIS_CACHE_ENABLED:false}
app.cache.attraction-ttl=${REDIS_ATTRACTION_TTL:PT10M}
app.cache.graph-ttl=${REDIS_GRAPH_TTL:PT10M}
app.cache.recommendation-ttl=${REDIS_RECOMMENDATION_TTL:PT1M}
